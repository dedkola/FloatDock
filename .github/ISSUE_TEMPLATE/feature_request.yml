name: Feature request
description: Suggest a metric, a behaviour, or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        FloatDock deliberately stays small. The bar for a new metric is whether it
        can be read **honestly** — from a public, reliable source, without guessing
        when it isn't available. Requests that fit that bar are very welcome.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution.
      placeholder: I can't tell whether a background build is saturating memory bandwidth.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      placeholder: A memory-pressure tile, or a bandwidth figure alongside CPU.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Known data source (optional)
      description: |
        If you know which API exposes this — a sysctl, a Mach host_statistics call,
        an IOKit property — name it. It makes the request far more likely to be
        picked up.
      placeholder: "sysctl kern.memorystatus_vm_pressure_level"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing apps that do this, or workarounds you use today.
    validations:
      required: false
